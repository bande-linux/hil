name: test

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: bande-linux/bootloader
          path: bootloader

      - name: Set up the proxyclient
        run: |
          python3 -m venv /tmp/hil-venv
          /tmp/hil-venv/bin/pip install -q -r bootloader/requirements.txt
          echo "PROXYCLIENT=$PWD/bootloader/proxyclient" >> "$GITHUB_ENV"
          echo "PYTHON=/tmp/hil-venv/bin/python3" >> "$GITHUB_ENV"

      - name: Test against the stub device
        run: $PYTHON -m unittest -v tests.test_hil
